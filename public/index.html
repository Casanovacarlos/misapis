
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Piece Dex</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    body {
      margin: 0;
      background: linear-gradient(-45deg, #ff5959, #ffcc00, #00c9ff, #0099ff);
      background-size: 400% 400%;
      animation: fondoAnimado 10s ease infinite;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
    }
    @keyframes fondoAnimado {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }
    .navbar {
      background: linear-gradient(90deg, #ff0000, #ff8800);
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .hero-section { text-align: center; margin-top: 60px; }
    .hero-section h1 { color: #ffd700; text-shadow: 3px 3px 12px rgba(0,0,0,0.7); font-size: 3.5rem; font-weight: 900; letter-spacing: 2px; }

    .carousel-item img {
      height: 400px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }
    .personaje-info {
      background: rgba(255,255,255,0.9);
      color: #212529;
      border-radius: 10px;
      padding: 15px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand me-lg-5 me-0" href="#">
    
      </a>
      <form class="d-flex ms-auto" role="search">
        <input id="busqueda" class="form-control me-2" type="search" placeholder="Buscar personaje">
        <button class="btn btn-dark" type="button" id="btnBuscar">Buscar</button>
      </form>
    </div>
  </nav>

  <section class="hero-section">
    <div class="container">
      <h1>⚓ One Piece Dex ⚓</h1>
      <p>Explora y gestiona tus personajes del mundo de One Piece</p>
    </div>
  </section>

  
  <section class="container my-4">
    <h3 class="text-center text-warning mb-3">Agregar o Editar Personaje</h3>
    <form id="formPersonaje" class="bg-light text-dark p-4 rounded shadow">
      <input type="hidden" id="personajeId">
      <div class="row g-3">
        <div class="col-md-4">
          <input id="nombre" class="form-control" placeholder="Nombre" required>
        </div>
        <div class="col-md-4">
          <input id="tripulacion" class="form-control" placeholder="Tripulación">
        </div>
        <div class="col-md-4">
          <input id="recompensa" class="form-control" placeholder="Recompensa">
        </div>
        <div class="col-md-6">
          <input id="poderes" class="form-control" placeholder="Poderes (separados por comas)">
        </div>
        <div class="col-md-6">
          <input id="haki" class="form-control" placeholder="Haki (separados por comas)">
        </div>
        <div class="col-md-6">
          <select id="puesto" class="form-select">
            <option value="">Selecciona el puesto en la tripulación</option>
            <option value="Capitán">Capitán</option>
            <option value="Primer Oficial">Primer Oficial</option>
            <option value="Navegante">Navegante</option>
            <option value="Médico">Médico</option>
            <option value="Cocinero">Cocinero</option>
            <option value="Artillero">Artillero</option>
            <option value="Espadachín">Espadachín</option>
            <option value="Ladrón">Ladrón</option>
            <option value="Carpintero">Carpintero</option>
            <option value="Otros">otros</option>
              
          </select>
        </div>
        <div class="col-md-6">
          <input id="imagen" class="form-control" placeholder="URL de imagen del personaje (opcional)">
        </div>
        <div class="col-12 text-center">
          <button type="submit" class="btn btn-danger mt-2">Guardar</button>
          <button type="button" id="btnCancelar" class="btn btn-secondary mt-2">Cancelar</button>
        </div>
      </div>
    </form>
  </section>

  
  <section class="container my-5">
    <h3 class="text-center text-light mb-4">Personajes Guardados</h3>
    <div id="carruselPersonajes" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner" id="contenedorCarrusel"></div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carruselPersonajes" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carruselPersonajes" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
      </button>
    </div>
  </section>

  <footer class="text-center py-3 text-white-50">
    <small>Creado con ❤️ por un fan de One Piece</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const form = document.getElementById('formPersonaje');
    const btnCancelar = document.getElementById('btnCancelar');
    const contenedorCarrusel = document.getElementById('contenedorCarrusel');
    const btnBuscar = document.getElementById('btnBuscar');
    const inputBusqueda = document.getElementById('busqueda');
    let todosPersonajes = [];

    const API = 'http://localhost:3000/api/personajes/'; 

    
    async function cargarPersonajes() {
      try {
        const res = await fetch(API);
        const apiPersonajes = await res.json();
        const localData = localStorage.getItem('personajes');
        todosPersonajes = localData ? JSON.parse(localData) : [];
        // Unir ambos, sin duplicar
        const idsLocales = todosPersonajes.map(p => p.id);
        apiPersonajes.forEach(p => {
          if (!idsLocales.includes(p.id)) todosPersonajes.push(p);
        });
      } catch (error) {
        console.error('Error al cargar desde API:', error);
        const localData = localStorage.getItem('personajes');
        todosPersonajes = localData ? JSON.parse(localData) : [];
      }
      mostrarCarrusel(todosPersonajes);
    }

    function mostrarCarrusel(lista) {
      contenedorCarrusel.innerHTML = '';
      if (lista.length === 0) {
        contenedorCarrusel.innerHTML = `<div class="carousel-item active text-center text-light"><p>No hay personajes aún 😢</p></div>`;
        return;
      }

      lista.forEach((p, i) => {
        const html = `
          <div class="carousel-item ${i === 0 ? 'active' : ''}">
            <div class="d-flex flex-column align-items-center">
              <img src="${p.imagen || 'https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg'}" class="d-block w-75" alt="${p.nombre}">
              <div class="personaje-info text-center w-75 mt-3">
                <h4>${p.nombre}</h4>
                <p><strong>Tripulación:</strong> ${p.tripulacion || 'Desconocida'} | <strong>Puesto:</strong> ${p.puesto || 'Ninguno'}</p>
                <p><strong>Recompensa:</strong> ${p.recompensa || 'Sin datos'}</p>
                <p><strong>Poderes:</strong> ${p.poderes.join(', ') || 'Ninguno'}</p>
                <p><strong>Haki:</strong> ${p.haki.join(', ') || 'Ninguno'}</p>
                <button class="btn btn-warning btn-sm me-2" onclick="editarPersonaje('${p.id}')"><i class="bi bi-pencil-square"></i> Editar</button>
                <button class="btn btn-danger btn-sm" onclick="borrarPersonaje('${p.id}')"><i class="bi bi-trash"></i> Eliminar</button>
              </div>
            </div>
          </div>`;
        contenedorCarrusel.insertAdjacentHTML('beforeend', html);
      });
    }

    // 🟣 Guardar o editar personaje
    form.addEventListener('submit', e => {
      e.preventDefault();
      const id = document.getElementById('personajeId').value;
      const personaje = {
        id: id || Date.now().toString(),
        nombre: document.getElementById('nombre').value,
        tripulacion: document.getElementById('tripulacion').value,
        recompensa: document.getElementById('recompensa').value,
        poderes: document.getElementById('poderes').value.split(',').map(p => p.trim()).filter(Boolean),
        haki: document.getElementById('haki').value.split(',').map(h => h.trim()).filter(Boolean),
        puesto: document.getElementById('puesto').value,
        imagen: document.getElementById('imagen').value
      };

      if (id) {
        const index = todosPersonajes.findIndex(p => p.id === id);
        todosPersonajes[index] = personaje;
      } else {
        todosPersonajes.push(personaje);
      }

      localStorage.setItem('personajes', JSON.stringify(todosPersonajes));
      form.reset();
      document.getElementById('personajeId').value = '';
      mostrarCarrusel(todosPersonajes);
    });

    
    window.editarPersonaje = function(id) {
      const p = todosPersonajes.find(x => x.id === id);
      if (!p) return;
      document.getElementById('personajeId').value = p.id;
      document.getElementById('nombre').value = p.nombre;
      document.getElementById('tripulacion').value = p.tripulacion;
      document.getElementById('recompensa').value = p.recompensa;
      document.getElementById('poderes').value = p.poderes.join(', ');
      document.getElementById('haki').value = p.haki.join(', ');
      document.getElementById('puesto').value = p.puesto || '';
      document.getElementById('imagen').value = p.imagen || '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    
    window.borrarPersonaje = function(id) {
      if (!confirm('¿Eliminar este personaje?')) return;
      todosPersonajes = todosPersonajes.filter(p => p.id !== id);
      localStorage.setItem('personajes', JSON.stringify(todosPersonajes));
      mostrarCarrusel(todosPersonajes);
    }

    
    btnBuscar.addEventListener('click', () => {
      const t = inputBusqueda.value.toLowerCase();
      const filtrados = todosPersonajes.filter(p => p.nombre.toLowerCase().includes(t));
      mostrarCarrusel(filtrados);
    });

    
    btnCancelar.addEventListener('click', () => {
      form.reset();
      document.getElementById('personajeId').value = '';
    });

    cargarPersonajes();
  </script>
</body>
</html>
